<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One Question ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
  }

  h1 {
    font-size: 24px;
  }

  #message {
    height: 20px;
    margin: 10px;
  }

  .buttons {
    position: relative;
    width: 250px;
    height: 120px;
    margin: auto;
  }

  .btn {
    position: absolute;
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  #yesBtn {
    background: #4CAF50;
    color: white;
    left: 20px;
    top: 40px;
  }

  #noBtn {
    background: #f44336;
    color: white;
    left: 130px;
    top: 40px;
  }

  #final {
    display: none;
  }

  #callBtn {
    padding: 12px 20px;
    font-size: 18px;
    margin-top: 20px;
    border-radius: 10px;
    border: none;
    background: #2196F3;
    color: white;
  }
</style>
</head>

<body>

<div class="container">
  <div id="main">
    <h1>Do you like me? ❤️</h1>
    <div id="message"></div>

    <div class="buttons">
      <button id="yesBtn" class="btn">Yes 😍</button>
      <button id="noBtn" class="btn">No 🙈</button>
    </div>
  </div>

  <div id="final">
    <h1>I knew it 😄❤️</h1>
    <button id="callBtn">Call Me 📞</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

let moveCount = 0;

const texts = [
  "Are you sure? 😏",
  "Think again 🙃",
  "Last chance 😜",
  "No escape 😆"
];

function moveNoInstant() {
  if (moveCount >= 4) {
    // overlap exactly on YES
    const rect = yesBtn.getBoundingClientRect();
    const parent = noBtn.offsetParent.getBoundingClientRect();

    noBtn.style.transform =
      `translate(${rect.left - parent.left}px, ${rect.top - parent.top}px)`;
    return;
  }

  const maxX = 150;
  const maxY = 80;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  // instant jump (no animation)
  noBtn.style.transition = "none";
  noBtn.style.transform = `translate(${x}px, ${y}px)`;

  // force reflow so next move can animate
  void noBtn.offsetWidth;
  noBtn.style.transition = "transform 0.2s ease";

  message.innerText = texts[moveCount];

  // grow YES button
  yesBtn.style.transform = `scale(${1 + moveCount * 0.15})`;

  moveCount++;
}

// Desktop hover
noBtn.addEventListener("mouseenter", moveNoInstant);

// Mobile: trigger immediately on touch
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNoInstant();
});

// YES click
yesBtn.onclick = () => {
  document.getElementById("main").style.display = "none";
  document.getElementById("final").style.display = "block";
};

// Call button
document.getElementById("callBtn").onclick = () => {
  window.location.href = "tel:+911234567890"; // change number
};
</script>

</body>
</html>
