<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hey ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: sans-serif;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
}

h1 {
  font-size: 24px;
}

#message {
  height: 20px;
  margin: 10px;
}

button {
  padding: 14px 22px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  position: fixed;
}

#yesBtn {
  background: #4CAF50;
  color: white;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
}

#noBtn {
  background: #f44336;
  color: white;
  top: 60%;
  left: 60%;
  transform: translate(-50%, -50%);
  transition: transform 0.15s linear;
}

#final {
  display: none;
  text-align: center;
}

#callBtn {
  margin-top: 20px;
  background: #2196F3;
  color: white;
}
</style>
</head>

<body>

<div class="container" id="main">
  <h1>Do you like me? ❤️</h1>
  <div id="message"></div>
</div>

<button id="yesBtn">Yes 😍</button>
<button id="noBtn">No 🙈</button>

<div id="final">
  <h1>I knew it 😄❤️</h1>
  <button id="callBtn">Call Me 📞</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

const texts = [
  "Are you sure? 😏",
  "Think again 🙃",
  "Not so easy 😜",
  "You can’t press it 😆"
];

let count = 0;

// Keep button always inside screen
function moveNo(x, y) {
  const padding = 80;

  let newX = Math.random() * (window.innerWidth - padding);
  let newY = Math.random() * (window.innerHeight - padding);

  // move away from finger
  if (x && y) {
    if (x < window.innerWidth / 2) newX += 80;
    else newX -= 80;

    if (y < window.innerHeight / 2) newY += 80;
    else newY -= 80;
  }

  noBtn.style.left = newX + "px";
  noBtn.style.top = newY + "px";
  noBtn.style.transform = "translate(-50%, -50%)";

  message.innerText = texts[count % texts.length];

  // grow YES button slowly 😏
  yesBtn.style.transform =
    `translateX(-50%) scale(${1 + count * 0.1})`;

  count++;
}

// Detect finger BEFORE click lands
document.addEventListener("touchstart", (e) => {
  const touch = e.touches[0];
  const rect = noBtn.getBoundingClientRect();

  const distX = Math.abs(touch.clientX - (rect.left + rect.width/2));
  const distY = Math.abs(touch.clientY - (rect.top + rect.height/2));

  // If finger is near button → escape!
  if (distX < 80 && distY < 80) {
    moveNo(touch.clientX, touch.clientY);
  }
});

// ALSO move if somehow hovered/near
document.addEventListener("touchmove", (e) => {
  const touch = e.touches[0];
  const rect = noBtn.getBoundingClientRect();

  const distX = Math.abs(touch.clientX - (rect.left + rect.width/2));
  const distY = Math.abs(touch.clientY - (rect.top + rect.height/2));

  if (distX < 100 && distY < 100) {
    moveNo(touch.clientX, touch.clientY);
  }
});

// YES clicked
yesBtn.onclick = () => {
  document.getElementById("main").style.display = "none";
  noBtn.style.display = "none";
  yesBtn.style.display = "none";
  document.getElementById("final").style.display = "block";
};

// Call button
document.getElementById("callBtn").onclick = () => {
  window.location.href = "tel:+911234567890"; // change this
};
</script>

</body>
</html>
